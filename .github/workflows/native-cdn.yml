name: Native CDN and 70658 checks
on:
  workflow_dispatch:
  push:
    branches: [codex/native-cdn-70658-20261106]
permissions:
  contents: read
jobs:
  server-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_clean_network.py' -v
