name: Launcher

# Builds the launcher for your server on Windows, Linux and macOS and publishes them in a GitHub release.
#
# Settings > Secrets and variables > Actions > Variables (repository variables, not secrets):
#   FOREVER_CA_CERT         required: the text of certs/ca/forever_root_ca.crt (public certificate, never the .key)
#   FOREVER_SERVER_ADDRESS  required: public IP or DNS name of the server
#   FOREVER_WEBSITE         optional: https://... (sign-up link and news in the launcher)
#   FOREVER_SERVER_NAME     optional: realm name shown in the launcher (default Forever)
#
# Actions > Launcher > Run workflow, with a version (e.g. 1.0.0) to publish the release v1.0.0; without a version
# the builds are only kept as run artifacts. Pushing a v* tag publishes a release too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0); empty = build only"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  FOREVER_CA_CERT: ${{ vars.FOREVER_CA_CERT }}
  FOREVER_SERVER_ADDRESS: ${{ vars.FOREVER_SERVER_ADDRESS }}
  FOREVER_WEBSITE: ${{ vars.FOREVER_WEBSITE }}
  FOREVER_SERVER_NAME: ${{ vars.FOREVER_SERVER_NAME }}
  # release version: the typed one, else the tag without its v
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
            artifact: Forever-Launcher-Linux
            files: app/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            artifact: Forever-Launcher-Windows
            files: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/forever-launcher.exe
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            artifact: Forever-Launcher-macOS
            files: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository variables
        shell: bash
        run: |
          if [ -z "$FOREVER_CA_CERT" ] && [ ! -f app/src-tauri/resources/forever_root_ca.crt ]; then
            echo "::error::Set the FOREVER_CA_CERT repository variable (text of certs/ca/forever_root_ca.crt)"; exit 1
          fi
          if [ -z "$FOREVER_SERVER_ADDRESS" ]; then
            echo "::warning::FOREVER_SERVER_ADDRESS is not set: the launcher will point to 127.0.0.1"
          fi

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Build
        working-directory: app
        shell: bash
        run: |
          version="${VERSION#v}"
          config=()
          [ -n "$version" ] && config=(--config "{\"version\":\"$version\"}")
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} "${config[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release tag
        shell: bash
        run: |
          v="${VERSION#v}"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Forever Launcher ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
