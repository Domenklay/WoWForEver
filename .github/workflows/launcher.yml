name: Launcher

# Needs app/src-tauri/resources/forever_root_ca.crt (your server's CA) in the repository.
# Run it by hand (Actions tab), or push a v* tag (e.g. v1.0.0) to also publish a GitHub release with the three builds.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
            artifact: Forever-Launcher-Linux
            files: app/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            artifact: Forever-Launcher-Windows
            files: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/forever-launcher.exe
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            artifact: Forever-Launcher-macOS
            files: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Build
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Forever Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
