name: WoW Forever Multi Windows

on:
  workflow_dispatch:
  push:
    branches: [codex/launcher-forever-multi-20261105, codex/launcher-official-20261106, codex/forever-upgrades-70707-20261106, codex/native-cdn-70658-20261106]
    paths: [app/**, tools/forever-casc-worker/**, scripts/inspect-forever-installation.ps1, tests/fixtures/official-installation.ps1, tests/fixtures/launcher-content-ui.js, docs/CLIENT-70707.ru.md, docs/SERVER-UPGRADES.ru.md, .github/workflows/launcher-multi.yml]

permissions:
  contents: read

concurrency:
  group: launcher-multi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      FOREVER_CA_CERT: ${{ vars.FOREVER_CA_CERT }}
      FOREVER_SERVER_ADDRESS: ${{ vars.FOREVER_SERVER_ADDRESS }}
      FOREVER_WEBSITE: ${{ vars.FOREVER_WEBSITE }}
      FOREVER_SERVER_NAME: ${{ vars.FOREVER_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            app/src-tauri
            tools/forever-casc-worker
      - name: Test and build independent native CDN worker
        run: |
          cargo test --locked --manifest-path tools/forever-casc-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path tools/forever-casc-worker/Cargo.toml
      - name: Package worker and corresponding GPL source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app/src-tauri/binaries -Force | Out-Null
          Copy-Item tools/forever-casc-worker/target/release/forever-casc-worker.exe app/src-tauri/binaries/
          Copy-Item tools/forever-casc-worker/LICENSE app/src-tauri/binaries/worker-LICENSE.txt
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('tools/forever-casc-worker')
          with ZipFile('app/src-tauri/binaries/worker-source.zip', 'w', ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if path.is_file() and 'target' not in path.relative_to(root).parts:
                      archive.write(path, 'forever-casc-worker/' + path.relative_to(root).as_posix())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test client workshop and content UI
        run: node tests/fixtures/launcher-content-ui.js .
      - name: Test read-only preload inspection in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/fixtures/official-installation.ps1 -Repository .
      - name: Test launcher and Windows process selection
        working-directory: app/src-tauri
        run: cargo test --locked --lib
      - name: Build installer and portable launcher
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item app/src-tauri/target/release/forever-launcher.exe dist/WoWForeverMulti.exe
          Copy-Item app/src-tauri/binaries/* dist/
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe dist/
          if ($env:FOREVER_CA_CERT) {
            [System.IO.File]::WriteAllText("$pwd/dist/forever_root_ca.crt", $env:FOREVER_CA_CERT)
          }
          $readme = [System.IO.File]::ReadAllText("$pwd/app/README-MULTI.ru.md")
          $readme = $readme.Replace("../docs/NATIVE-CDN.ru.md", "NATIVE-CDN.ru.md").Replace("../docs/RESTORE-70658.ru.md", "RESTORE-70658.ru.md").Replace("../docs/CLIENT-WORKSHOP.ru.md", "CLIENT-WORKSHOP.ru.md").Replace("../docs/CLIENT-70707.ru.md", "CLIENT-70707.ru.md").Replace("../docs/SERVER-UPGRADES.ru.md", "SERVER-UPGRADES.ru.md").Replace("../docs/screenshots/", "https://raw.githubusercontent.com/Domenklay/WoWForEver/codex/launcher-forever-multi-20261105/docs/screenshots/")
          $readme = $readme.Replace("../docs/ADDON-CHANNELS.ru.md", "ADDON-CHANNELS.ru.md")
          $readme = $readme.Replace("../docs/BOOTSTRAP-AUDIT.ru.md", "BOOTSTRAP-AUDIT.ru.md").Replace("../docs/GAMEPLAY-70658.ru.md", "GAMEPLAY-70658.ru.md")
          [System.IO.File]::WriteAllText("$pwd/dist/README.ru.md", $readme)
          $guide = [System.IO.File]::ReadAllText("$pwd/docs/CLIENT-WORKSHOP.ru.md").Replace("../content/client-manifest.schema.json", "client-manifest.schema.json")
          [System.IO.File]::WriteAllText("$pwd/dist/CLIENT-WORKSHOP.ru.md", $guide)
          Copy-Item docs/ADDON-CHANNELS.ru.md dist/ADDON-CHANNELS.ru.md
          Copy-Item addons/channels.json dist/addon-channels.json
          Copy-Item docs/ASCENSION-70658.ru.md dist/ASCENSION-70658.ru.md
          Copy-Item docs/GAMEPLAY-70658.ru.md dist/GAMEPLAY-70658.ru.md
          Copy-Item docs/OFFICIAL-CLIENT.ru.md dist/OFFICIAL-CLIENT.ru.md
          Copy-Item docs/CLIENT-70707.ru.md dist/CLIENT-70707.ru.md
          Copy-Item docs/SERVER-UPGRADES.ru.md dist/SERVER-UPGRADES.ru.md
          Copy-Item docs/NATIVE-CDN.ru.md dist/NATIVE-CDN.ru.md
          Copy-Item docs/BOOTSTRAP-AUDIT.ru.md dist/BOOTSTRAP-AUDIT.ru.md
          Copy-Item docs/RESTORE-70658.ru.md dist/RESTORE-70658.ru.md
          Copy-Item docs/CLIENT-STARTUP-DIAGNOSTICS.ru.md dist/CLIENT-STARTUP-DIAGNOSTICS.ru.md
          New-Item -ItemType Directory -Path dist/scripts -Force | Out-Null
          Copy-Item scripts/collect-client-startup.ps1 dist/scripts/collect-client-startup.ps1
          Copy-Item scripts/inspect-forever-installation.ps1 dist/scripts/inspect-forever-installation.ps1
          Copy-Item content/client-manifest.schema.json dist/client-manifest.schema.json
          Get-ChildItem dist -Filter *.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Multi-Windows-1.9.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
