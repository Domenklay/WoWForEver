name: Client startup diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/launcher-forever-multi-20261105]
    paths:
      - scripts/collect-client-startup.ps1
      - tests/fixtures/client-startup-diagnostics.ps1
      - docs/CLIENT-STARTUP-DIAGNOSTICS.ru.md
      - .github/workflows/client-startup-diagnostics.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: startup-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Cancel older diagnostics tests
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'client-startup-diagnostics.yml',
              branch: context.ref.replace('refs/heads/', ''), per_page: 20
            });
            for (const run of data.workflow_runs) {
              if (run.id < context.runId && ['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
      - uses: actions/checkout@v4
      - name: Verify collector with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/fixtures/client-startup-diagnostics.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Forever-client-startup-diagnostics
          path: |
            scripts/collect-client-startup.ps1
            docs/CLIENT-STARTUP-DIAGNOSTICS.ru.md
          if-no-files-found: error
          retention-days: 7
