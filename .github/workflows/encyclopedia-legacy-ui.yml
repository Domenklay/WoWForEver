name: Encyclopedia native Legacy UI (70658)
on:
  push:
    branches: [feature/encyclopedia-legacy-ui-70658]
    paths:
      - 'mods/living-encyclopedia/addon/**'
      - 'tests/fixtures/encyclopedia-legacy-mock.lua'
      - 'tests/test_encyclopedia_legacy.py'
      - '.github/workflows/encyclopedia-legacy-ui.yml'
  pull_request:
    paths:
      - 'mods/living-encyclopedia/addon/**'
      - 'tests/fixtures/encyclopedia-legacy-mock.lua'
      - 'tests/test_encyclopedia_legacy.py'
  workflow_dispatch:
jobs:
  native-legacy-tab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.1 syntax validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          find mods/living-encyclopedia/addon/ForeverEncyclopedia -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p tests/fixtures/encyclopedia-legacy-mock.lua
      - name: Simulated real fourth Blizzard Legacy page and talent purchases
        run: lua5.1 tests/fixtures/encyclopedia-legacy-mock.lua mods/living-encyclopedia/addon/ForeverEncyclopedia
      - name: Check addon completeness and saved UI protocol
        run: python3 tests/test_encyclopedia_legacy.py
