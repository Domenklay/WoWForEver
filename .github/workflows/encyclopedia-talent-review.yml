name: Encyclopedia talents and mana review
on:
  push:
    branches: [feature/encyclopedia-tooltip-mana-20261107]
    paths: [mods/living-encyclopedia/**, app/src-tauri/addons/forever-encyclopedia.json, app/src-tauri/addons/forever-encyclopedia-test.json, app/src-tauri/src/addon.rs, app/src-tauri/src/config.rs, app/src-tauri/src/lib.rs, app/ui/**, scripts/update-encyclopedia-addon.ps1, tests/fixtures/encyclopedia-addon.ps1, scripts/clean-forever-server.py, scripts/enable-clean-gameplay.py, tests/test_clean_gameplay.py, .github/workflows/encyclopedia-talent-review.yml]
  pull_request:
    branches: [codex/native-cdn-70658-20261106]
    paths: [mods/living-encyclopedia/**, app/src-tauri/addons/forever-encyclopedia.json, app/src-tauri/addons/forever-encyclopedia-test.json, app/src-tauri/src/addon.rs, app/src-tauri/src/config.rs, app/src-tauri/src/lib.rs, app/ui/**, scripts/update-encyclopedia-addon.ps1, tests/fixtures/encyclopedia-addon.ps1, scripts/clean-forever-server.py, scripts/enable-clean-gameplay.py, tests/test_clean_gameplay.py, .github/workflows/encyclopedia-talent-review.yml]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash mods/living-encyclopedia/tests/run-rules.sh
      - run: python3 -m unittest discover -s tests -q
  pinned-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and core dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ libboost-all-dev libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev
      - name: Fetch exact core sources
        run: |
          git init "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" remote add origin https://github.com/advocaite/TrinityCore.git
          git -C "$RUNNER_TEMP/core" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/core" sparse-checkout set src dep cmake
          git -C "$RUNNER_TEMP/core" -c protocol.version=2 fetch --depth 1 --filter=blob:none origin b4e7b940593f6402a822d4fbcdf31331d16f73b6
          git -C "$RUNNER_TEMP/core" checkout --detach FETCH_HEAD
      - name: Inject current modules
        run: |
          git -C "$RUNNER_TEMP/core" apply "$GITHUB_WORKSPACE/docker/patches/0004-forever-subclass-server-addon-endpoint.patch"
          python3 scripts/inject-gameplay.py "$RUNNER_TEMP/core"
          python3 scripts/inject-gameplay.py "$RUNNER_TEMP/core"
      - name: Configure pinned compiler flags
        run: cmake -S "$RUNNER_TEMP/core" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTOOLS=0 -DSERVERS=1 -DUSE_COREPCH=0 -DUSE_SCRIPTPCH=0 -DWITH_WARNINGS=0
      - name: Compile injected adapters and changed core units
        run: python3 scripts/check-gameplay-core.py --build "$RUNNER_TEMP/build"

  ui-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --check app/ui/app.js
      - run: node --check app/ui/i18n.js
      - run: node tests/fixtures/launcher-content-ui.js .
  windows-addon-download:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned test download, backups and stable channel rollback
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/fixtures/encyclopedia-addon.ps1 -Repository .
