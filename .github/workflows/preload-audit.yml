name: Read-only preload audit checks
on:
  workflow_dispatch:
  push:
    branches: [codex/preload-audit-20261106]
    paths: [scripts/audit-client-preload.py, tests/test_client_preload_audit.py, .github/workflows/preload-audit.yml]
permissions:
  contents: read
jobs:
  verified-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_client_preload_audit.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_clean_game_tables.py' -v
