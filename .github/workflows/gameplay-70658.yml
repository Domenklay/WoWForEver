name: Combined gameplay on pinned 70658
on:
  pull_request:
    paths: [mod-forever-scaling/**, mods/forever-dungeon-finder/**, scripts/inject-gameplay.py, scripts/inject-forever-scaling.py, scripts/inject-forever-dungeons.py, scripts/inject-forever-dungeon-finder.py, scripts/enable-clean-gameplay.py, scripts/upgrade-clean-gameplay.py, scripts/clean-forever-server.py, scripts/check-gameplay-core.py, docker/gameplay/**, tests/test_gameplay_transition.py, tests/test_clean_gameplay.py, .github/workflows/gameplay-70658.yml]
  push:
    branches: [codex/native-cdn-70658-20261106, feature/dungeon-gameplay-upgrade-70658]
    paths: [mods/living-encyclopedia/**, mod-forever-scaling/**, scripts/inject-gameplay.py, scripts/inject-forever-scaling.py, scripts/inject-forever-dungeons.py, scripts/inject-forever-dungeon-finder.py, scripts/check-gameplay-core.py, scripts/enable-clean-gameplay.py, scripts/upgrade-clean-gameplay.py, scripts/test-baseline-services.py, scripts/clean-forever-server.py, scripts/module_readiness.py, docker/gameplay/**, tests/test_clean_gameplay.py, tests/test_module_readiness.py, .github/workflows/gameplay-70658.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and core dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ libboost-all-dev libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev
      - name: Fetch pinned source without SQL payloads
        run: |
          git init "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" remote add origin https://github.com/advocaite/TrinityCore.git
          git -C "$RUNNER_TEMP/core" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/core" sparse-checkout set src dep cmake
          git -C "$RUNNER_TEMP/core" -c protocol.version=2 fetch --depth 1 --filter=blob:none origin b4e7b940593f6402a822d4fbcdf31331d16f73b6
          git -C "$RUNNER_TEMP/core" checkout --detach FETCH_HEAD
      - name: Inject all modules together twice
        run: |
          git -C "$RUNNER_TEMP/core" apply "$GITHUB_WORKSPACE/docker/patches/0004-forever-subclass-server-addon-endpoint.patch"
          python3 scripts/inject-gameplay.py "$RUNNER_TEMP/core"
          python3 scripts/inject-gameplay.py "$RUNNER_TEMP/core"
      - name: Generate real core compile commands
        run: cmake -S "$RUNNER_TEMP/core" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTOOLS=0 -DSERVERS=1 -DUSE_COREPCH=0 -DUSE_SCRIPTPCH=0 -DWITH_WARNINGS=0
      - name: Compile adapters and modified core units
        run: python3 scripts/check-gameplay-core.py --build "$RUNNER_TEMP/build"
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash mods/living-encyclopedia/tests/run-rules.sh
      - run: bash mod-forever-scaling/tests/run.sh
      - run: python3 -m unittest discover -s tests -q
