# Optional: publish the website through an existing Traefik (v2/v3) reverse proxy.
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# Set SITE_DOMAIN in .env; TRAEFIK_NETWORK is the Docker network Traefik watches,
# TRAEFIK_ENTRYPOINT / TRAEFIK_CERTRESOLVER the names used in your Traefik configuration.
services:
  web:
    networks: [forever, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.forever-web.rule=Host(`${SITE_DOMAIN:?set SITE_DOMAIN in .env}`)
      - traefik.http.routers.forever-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.forever-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.forever-web.loadbalancer.server.port=8000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
